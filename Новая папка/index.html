<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia — ювелирные изделия</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#16120e;--surface:#1f1a14;--line:#3a3025;--text:#efe6d6;--muted:#a39683;--gold:#d4af6a;--gold-d:#9c7b3e;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:300 16px/1.6 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,5vw,64px);border-bottom:1px solid var(--line)}
.logo{font:500 28px var(--serif);letter-spacing:.12em;color:var(--gold)}
.cartbtn{background:none;border:1px solid var(--gold-d);padding:8px 18px;border-radius:2px;color:var(--gold)}
.cartbtn:hover{background:var(--gold);color:var(--bg)}
.hero{padding:clamp(48px,10vw,120px) clamp(16px,5vw,64px) 48px;max-width:900px}
.hero h1{font:400 clamp(40px,7vw,84px)/1.05 var(--serif);margin:0 0 20px}
.hero p{max-width:46ch;color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding:16px clamp(16px,5vw,64px);border-block:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);padding:6px 16px;border-radius:20px;color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.ctl{display:flex;gap:12px}
select{background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px;padding:36px clamp(16px,5vw,64px) 80px}
.card{display:flex;flex-direction:column}
.pic{aspect-ratio:1;background:radial-gradient(circle at 50% 40%,#2c241a,#18130e 75%);border:1px solid var(--line);display:grid;place-items:center}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:56%;height:56%}
.card h3{font:500 22px var(--serif);margin:14px 0 2px}
.meta{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font:500 20px var(--serif);color:var(--gold)}
.add{background:none;border:1px solid var(--gold-d);padding:6px 14px;border-radius:2px;color:var(--gold);font-size:14px}
.add:hover{background:var(--gold);color:var(--bg)}
.empty{grid-column:1/-1;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s;z-index:11;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
aside h2{font:500 28px var(--serif);margin:0;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:26px;color:var(--muted)}
.items{flex:1;overflow:auto;margin:16px 0}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;background:none;border:1px solid var(--line);border-radius:50%}
.rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;justify-self:end}
.tot{display:flex;justify-content:space-between;font:500 22px var(--serif);margin-bottom:14px}
.cta{width:100%;background:var(--gold);color:var(--bg);border:0;padding:13px;border-radius:2px;font-weight:500}
.cta:disabled{opacity:.4;cursor:not-allowed}
form{display:grid;gap:12px;margin-top:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:2px;color:var(--text)}
input:invalid:not(:placeholder-shown){border-color:#c0675b}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;justify-self:start}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
label.chk input{width:auto;padding:0;margin-top:3px;accent-color:var(--gold)}
label.chk .link{display:inline;color:var(--gold)}
.policy h3{font:500 18px var(--serif);margin:16px 0 4px}.policy p{margin:0;font-size:14px}
footer{padding:28px clamp(16px,5vw,64px) 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}footer a{color:var(--gold)}
.err{color:#e0897d;margin:0;font-size:14px}
.done{text-align:center;margin:auto 0}
.done h2{justify-content:center;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="logo">AURELIA</div><button class="cartbtn" id="open">Корзина (<span id="cnt">0</span>)</button></header>
<section class="hero">
<h1>Золото, которое носят каждый день</h1>
<p>Цепочки, кольца, браслеты и серьги из золота 585 и серебра 925. Бесплатная доставка от 20 000 ₴.</p>
</section>
<div class="bar">
<div class="chips" id="cats" role="group" aria-label="Категория"></div>
<div class="ctl">
<select id="metal" aria-label="Металл"><option value="">Любой металл</option><option>Жёлтое золото</option><option>Розовое золото</option><option>Серебро</option></select>
<select id="sort" aria-label="Сортировка"><option value="">По умолчанию</option><option value="a">Сначала дешёвые</option><option value="d">Сначала дорогие</option></select>
</div>
</div>
<main class="grid" id="grid"></main>
<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="Корзина" aria-hidden="true"></aside>

<footer>Вопросы по заказу и персональным данным: <a href="mailto:support@etsyadm.help">support@etsyadm.help</a></footer>
<script>
// Фото: добавьте к товару поле img, например {id:1,n:'...',img:'photos/chain-1.jpg',...}. Без img показывается иконка.
const P=[
{id:1,n:'Цепочка «Якорь»',t:'chain',m:'Жёлтое золото',p:18400,d:'Золото 585, 50 см'},
{id:2,n:'Цепочка «Бисмарк»',t:'chain',m:'Серебро',p:3200,d:'Серебро 925, 45 см'},
{id:3,n:'Цепочка «Роза»',t:'chain',m:'Розовое золото',p:21700,d:'Золото 585, 45 см'},
{id:4,n:'Кольцо «Солитер»',t:'ring',m:'Жёлтое золото',p:32500,d:'Фианит, золото 585'},
{id:5,n:'Кольцо «Лента»',t:'ring',m:'Серебро',p:2400,d:'Серебро 925, 4 мм'},
{id:6,n:'Кольцо «Рассвет»',t:'ring',m:'Розовое золото',p:27900,d:'Золото 585, топаз'},
{id:7,n:'Браслет «Звено»',t:'bracelet',m:'Жёлтое золото',p:24600,d:'Золото 585, 19 см'},
{id:8,n:'Браслет «Нить»',t:'bracelet',m:'Серебро',p:2900,d:'Серебро 925, 18 см'},
{id:9,n:'Серьги «Капля»',t:'earrings',m:'Жёлтое золото',p:15800,d:'Золото 585, пусеты'},
{id:10,n:'Серьги «Кольца»',t:'earrings',m:'Серебро',p:2100,d:'Серебро 925, d 20 мм'},
{id:11,n:'Подвеска «Слеза»',t:'pendant',m:'Розовое золото',p:12300,d:'Золото 585, фианит'},
{id:12,n:'Подвеска «Круг»',t:'pendant',m:'Серебро',p:1800,d:'Серебро 925, 15 мм'}];
const C={'':'Все',ring:'Кольца',chain:'Цепочки',bracelet:'Браслеты',earrings:'Серьги',pendant:'Подвески'};
const MC={'Жёлтое золото':'#d4af6a','Розовое золото':'#dba08c','Серебро':'#cfd4da'};
// Адрес формы для заказов (Formspree и т. п.). Пока пусто — сайт работает в демо-режиме без отправки.
const ORDER_ENDPOINT='';
const uah=n=>n.toLocaleString('ru-RU')+' ₴';
let cat='',cart={},view='cart',draft={};
const esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function readDraft(){const f=document.getElementById('f');if(!f)return;const d=new FormData(f);draft={n:d.get('n'),t:d.get('t'),e:d.get('e'),a:d.get('a'),c:!!d.get('c'),m:!!d.get('m')}}
try{cart=JSON.parse(localStorage.getItem('cart')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};

function icon(t,c){
const s=`fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"`;
const g={
ring:`<circle cx="50" cy="64" r="24" ${s}/><path d="M40 28l10-10 10 10-10 14z" fill="${c}"/>`,
chain:`<path d="M12 22Q50 100 88 22" ${s} stroke-dasharray="9 6"/>`,
bracelet:`<circle cx="50" cy="50" r="32" ${s} stroke-dasharray="10 5"/>`,
earrings:`<circle cx="30" cy="38" r="5" fill="${c}"/><circle cx="70" cy="38" r="5" fill="${c}"/><path d="M30 48v22M70 48v22" ${s}/><circle cx="30" cy="78" r="8" fill="${c}"/><circle cx="70" cy="78" r="8" fill="${c}"/>`,
pendant:`<path d="M14 14L50 52 86 14" ${s} stroke-width="3"/><path d="M50 52c-14 16-14 30 0 34 14-4 14-18 0-34z" fill="${c}"/>`};
return `<svg viewBox="0 0 100 100" aria-hidden="true">${g[t]}</svg>`}

function renderCats(){
cats.innerHTML=Object.entries(C).map(([k,v])=>`<button class="chip" aria-pressed="${k===cat}" data-c="${k}">${v}</button>`).join('')}
function renderGrid(){
let l=P.filter(p=>(!cat||p.t===cat)&&(!metal.value||p.m===metal.value));
if(sort.value)l.sort((a,b)=>sort.value==='a'?a.p-b.p:b.p-a.p);
grid.innerHTML=l.length?l.map(p=>`<article class="card"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.n)}" loading="lazy">`:icon(p.t,MC[p.m])}</div><h3>${p.n}</h3><div class="meta">${p.m} · ${p.d}</div><div class="row"><span class="price">${uah(p.p)}</span><button class="add" data-a="${p.id}">В корзину</button></div></article>`).join(''):'<p class="empty">Ничего не найдено. Смените категорию или металл.</p>'}

const items=()=>Object.entries(cart).map(([id,q])=>({p:P.find(x=>x.id==id),q}));
const total=()=>items().reduce((s,i)=>s+i.p.p*i.q,0);
function renderCart(){
const l=items();cnt.textContent=l.reduce((s,i)=>s+i.q,0);
if(view==='done')return;
if(view==='policy'){
cartEl.innerHTML=`<h2>Политика <button class="x" data-x aria-label="Закрыть">×</button></h2>
<div class="items policy"><p class="meta">Черновик: перед запуском магазина проверьте текст у юриста и подставьте данные продавца.</p>
<h3>1. Какие данные мы собираем</h3><p>Имя, телефон, email и адрес доставки, которые вы указываете при оформлении заказа.</p>
<h3>2. Зачем они нужны</h3><p>Чтобы принять и доставить заказ, связаться с вами по нему и отправлять уведомления о заказе и оплате на ваш email.</p>
<h3>3. Рассылка</h3><p>Рассылку о новинках и акциях мы отправляем только тем, кто отдельно отметил на это согласие. Отписаться можно по ссылке в любом письме или написав нам.</p>
<h3>4. Хранение и передача</h3><p>Данные хранятся столько, сколько нужно для выполнения заказа и требований закона. Мы передаём их только службе доставки и платёжным сервисам, без этого заказ выполнить нельзя.</p>
<h3>5. Ваши права</h3><p>Вы можете запросить доступ к данным, их исправление или удаление, а также отозвать согласие, написав на support@etsyadm.help.</p>
<h3>6. Продавец</h3><p>[Название продавца, адрес, контакты]</p></div>
<button class="cta" data-pback>Вернуться к заказу</button>`;return}
if(view==='form'){
cartEl.innerHTML=`<h2>Оформление <button class="x" data-x aria-label="Закрыть">×</button></h2>
<form id="f"><label>Имя<input name="n" required placeholder=" " autocomplete="name" value="${esc(draft.n)}"></label>
<label>Телефон<input name="t" type="tel" required pattern="[0-9+()\\s-]{10,}" placeholder=" " autocomplete="tel" value="${esc(draft.t)}"></label>
<label>Email для уведомлений о заказе<input name="e" type="email" required placeholder=" " autocomplete="email" value="${esc(draft.e)}"></label>
<label>Город и отделение доставки<input name="a" required placeholder=" " autocomplete="address-level2" value="${esc(draft.a)}"></label>
<label class="chk"><input type="checkbox" name="c" required ${draft.c?'checked':''}><span>Я согласен(на) с <button type="button" class="link" data-pol>политикой конфиденциальности</button> и на получение уведомлений о заказе и оплате на email</span></label>
<label class="chk"><input type="checkbox" name="m" ${draft.m?'checked':''}><span>Хочу получать рассылку о новинках и акциях (необязательно)</span></label>
<div class="tot"><span>К оплате</span><span>${uah(total())}</span></div>
<button class="cta">Подтвердить заказ</button><button type="button" class="link" data-back>Назад в корзину</button></form>`;return}
cartEl.innerHTML=`<h2>Корзина <button class="x" data-x aria-label="Закрыть">×</button></h2>
<div class="items">${l.length?l.map(i=>`<div class="it"><div><strong>${i.p.n}</strong><div class="meta">${i.p.m}</div></div><div class="price">${uah(i.p.p*i.q)}</div>
<div class="qty"><button data-m="${i.p.id}" aria-label="Меньше">−</button>${i.q}<button data-p="${i.p.id}" aria-label="Больше">+</button></div><button class="rm" data-r="${i.p.id}">Удалить</button></div>`).join(''):'<p class="meta">Корзина пуста. Добавьте украшение из каталога.</p>'}</div>
<div class="tot"><span>Итого</span><span>${uah(total())}</span></div>
<button class="cta" data-go ${l.length?'':'disabled'}>Оформить заказ</button>`}

const cartEl=document.getElementById('cart');
function open(v){if(v)cartEl.classList.add('on'),scrim.classList.add('on'),cartEl.setAttribute('aria-hidden','false');}
function close(){cartEl.classList.remove('on');scrim.classList.remove('on');cartEl.setAttribute('aria-hidden','true');if(view==='done'){view='cart';renderCart()}}
const chg=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart()};

cats.onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;renderCats();renderGrid()}};
metal.onchange=sort.onchange=renderGrid;
grid.onclick=e=>{const b=e.target.closest('[data-a]');if(b){chg(b.dataset.a,1);b.textContent='Добавлено';setTimeout(()=>b.textContent='В корзину',1200)}};
document.getElementById('open').onclick=()=>{view='cart';renderCart();open(1)};
scrim.onclick=close;
cartEl.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if('x'in d)close();else if(d.p)chg(d.p,1);else if(d.m)chg(d.m,-1);else if(d.r){delete cart[d.r];save();renderCart()}
else if('go'in d){view='form';renderCart()}else if('back'in d){readDraft();view='cart';renderCart()}else if('pol'in d){readDraft();view='policy';renderCart()}else if('pback'in d){view='form';renderCart()}};
cartEl.onsubmit=async e=>{e.preventDefault();
const f=e.target,btn=f.querySelector('.cta'),fd=new FormData(f);
const num=Math.floor(100000+Math.random()*900000);
const lines=items().map(i=>`${i.p.n} (${i.p.m}) × ${i.q} = ${uah(i.p.p*i.q)}`).join('\n');
const body={_subject:`Новый заказ №${num} на ${uah(total())}`,order:num,name:fd.get('n'),phone:fd.get('t'),email:fd.get('e'),consent_policy:'да',newsletter:fd.get('m')?'да':'нет',address:fd.get('a'),items:lines,total:uah(total())};
if(ORDER_ENDPOINT){btn.disabled=true;btn.textContent='Отправляем…';
try{const r=await fetch(ORDER_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status)}
catch(err){btn.disabled=false;btn.textContent='Подтвердить заказ';let m=f.querySelector('.err');if(!m){m=document.createElement('p');m.className='err';f.prepend(m)}m.textContent='Не удалось отправить заказ. Проверьте интернет и попробуйте ещё раз.';return}}
cart={};draft={};save();view='done';cnt.textContent=0;
cartEl.innerHTML=`<h2><span></span><button class="x" data-x aria-label="Закрыть">×</button></h2><div class="done"><h2>Заказ №${num} принят</h2><p class="meta">Мы позвоним вам в течение часа, чтобы подтвердить доставку. Вопросы: support@etsyadm.help.</p><button class="cta" data-x>Вернуться в каталог</button></div>`};
document.onkeydown=e=>{if(e.key==='Escape')close()};
renderCats();renderGrid();renderCart();
</script>
</body>
</html>
